# Production static-site vhost. Installation is a separately authorized operation.
server {
    listen 80;
    listen [::]:80;
    server_name jaredgoldberg.org www.jaredgoldberg.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jaredgoldberg.org www.jaredgoldberg.org;
    root /var/www/jaredgoldberg.org/current;
    index index.html;
    autoindex off;
    open_file_cache off;

    ssl_certificate /etc/letsencrypt/live/jaredgoldberg.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jaredgoldberg.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /robots.txt { try_files $uri =404; }
    location = /release.json { try_files $uri =404; }
    location = /artifact-manifest.json { try_files $uri =404; }
    location = /media-archives-and-memory/ { try_files /media-archives-and-memory/index.html =404; }
    location = /media-archives-and-memory/index.html { try_files $uri =404; }
    location = /community-service/ { try_files /community-service/index.html =404; }
    location = /community-service/index.html { try_files $uri =404; }
    location = /systems-and-institutions/ { try_files /systems-and-institutions/index.html =404; }
    location = /systems-and-institutions/index.html { try_files $uri =404; }
    location = /art/ { try_files /art/index.html =404; }
    location = /art/index.html { try_files $uri =404; }

    location ~ "^/assets/[a-z-]+\.[a-f0-9]{16}\.(css|js)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
    location = /fonts/OFL.txt { try_files $uri =404; }
    location = /favicon.svg { try_files $uri =404; }
    location ~ ^/fonts/[a-zA-Z0-9_.-]+\.(woff2?|ttf|otf)$ { try_files $uri =404; }
    location / { return 404; }
}
