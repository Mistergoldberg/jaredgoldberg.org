server {
    server_name jaredgoldberg.org www.jaredgoldberg.org;
    root /var/www/jaredgoldberg.org/current;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/jaredgoldberg.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jaredgoldberg.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;

    server_name jaredgoldberg.org www.jaredgoldberg.org;
    return 301 https://$host$request_uri;
}
