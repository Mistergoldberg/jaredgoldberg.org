# Temporary QA-only HTTP-01 bootstrap. Replace with the HTTPS vhost after issuance.
server {
    listen 80;
    listen [::]:80;
    server_name qa.jaredgoldberg.org;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/jaredgoldberg.org/shared/qa-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://qa.jaredgoldberg.org$request_uri; }
}
