# QA ONLY. Install only once DNS and this hostname's TLS certificate are ready.
# Existing production virtual hosts are not inputs to this file.
server {
    listen 80;
    listen [::]:80;
    server_name qa.jaredgoldberg.org;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    return 404;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name qa.jaredgoldberg.org;
    root /var/www/jaredgoldberg.org/qa-current;
    index index.html;
    autoindex off;
    open_file_cache off;

    ssl_certificate /etc/letsencrypt/live/qa.jaredgoldberg.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qa.jaredgoldberg.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /robots.txt { try_files $uri =404; }
    location = /release.json { try_files $uri =404; }
    location = /artifact-manifest.json { try_files $uri =404; }

    location ~ ^/assets/[a-z-]+\.[a-f0-9]{16}\.(css|js)$ {
        try_files $uri =404;
        # Repeat headers: Nginx add_header inheritance stops at this location.
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /favicon.svg { try_files $uri =404; }
    location ~ ^/fonts/[a-zA-Z0-9_.-]+\.(woff2?|ttf|otf)$ { try_files $uri =404; }
    location / { return 404; }
}
